name: YANIME Optimized Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

# Separate concurrency per ref: a new run cancels only an older run on the same ref.
concurrency:
  group: yanime-optimized-build-${{ github.ref }}
  # Never kill an active build: Gradle cache is saved during the post-job step.
  # Keep one active run per branch and let newer commits wait their turn.
  cancel-in-progress: false

jobs:
  build:
    name: Build optimized APK
    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}
    # Internal PRs are already built by their branch push; avoid a duplicate runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Trusted branch pushes can save cache; pull requests only restore it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # No encryption secret required. Gradle dependency and build caches are still persisted.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: |
          compile_sdk=$(grep -m1 '^android-compileSdk' gradle/libs.versions.toml | cut -d'"' -f2)
          case "$compile_sdk" in
            *.*) platform_version="$compile_sdk" ;;
            *)   platform_version="$compile_sdk.0" ;;
          esac
          echo "compileSdk=$compile_sdk -> platforms;android-$platform_version"
          (yes || true) | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-$platform_version"

      # BuildConfig reads this value from local.properties via yummytv.apiBaseUrl.
      # A repository Actions variable can override the default API host.
      - name: Configure YummyTV API base URL
        env:
          API_BASE_URL: ${{ vars.YUMMY_TV_API_BASE_URL || 'https://v2.yummytv.afk.su/api' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::YUMMY_TV_API_BASE_URL must be an HTTPS URL"
            exit 1
          fi
          printf 'yummytv.apiBaseUrl=%s\n' "$API_BASE_URL" >> local.properties
          echo "Configured YummyTV API base URL."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner memory before Gradle:"
          free -h
          echo "Top memory consumers before Gradle:"
          ps -eo pid,rss,comm --sort=-rss | head -n 12

          # Keep periodic memory snapshots in the job log while Gradle is running.
          (
            while sleep 60; do
              echo "::group::Runner memory snapshot"
              date -u
              free -h
              ps -eo pid,rss,comm --sort=-rss | head -n 12
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; echo "Runner memory at Gradle exit:"; free -h; ps -eo pid,rss,comm --sort=-rss | head -n 12' EXIT

          ./gradlew :app:assembleReleaseDebug --stacktrace --profile

      - name: Upload Gradle build profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-profile
          path: build/reports/profile/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v7
        with:
          name: room-schema-70
          path: core/storage/schemas/su.afk.yummy.tv.core.storage.db.AppDatabase/71.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Re-sign APK with the standard Android testkey
        shell: bash
        run: |
          set -euo pipefail

          key_dir="$RUNNER_TEMP/android-testkey"
          mkdir -p "$key_dir"

          # AOSP's public test signing key (not suitable for production releases).
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT' \
            | base64 --decode > "$key_dir/testkey.pk8"
          curl -fsSL 'https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT' \
            | base64 --decode > "$key_dir/testkey.x509.pem"

          # apksigner --key requires unencrypted PKCS#8 in DER format.
          # AOSP's .pk8 file is already in that format; do not convert it to PEM.
          openssl pkcs8 -inform DER -nocrypt \
            -in "$key_dir/testkey.pk8" \
            -out /dev/null

          # Confirm that the downloaded certificate belongs to this private key.
          openssl pkey -inform DER -in "$key_dir/testkey.pk8" -pubout \
            -out "$key_dir/key-public.pem"
          openssl x509 -in "$key_dir/testkey.x509.pem" -pubkey -noout \
            > "$key_dir/cert-public.pem"
          diff -u "$key_dir/key-public.pem" "$key_dir/cert-public.pem"

          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"

          shopt -s nullglob
          apks=(app/build/outputs/apk/releaseDebug/*.apk)
          test "${#apks[@]}" -gt 0

          for apk in "${apks[@]}"; do
            "$apksigner" sign \
              --key "$key_dir/testkey.pk8" \
              --cert "$key_dir/testkey.x509.pem" \
              "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(jq -er '.elements[0].versionName | select(type == "string" and length > 0)' app/build/outputs/apk/releaseDebug/output-metadata.json)"
          [[ "$version_name" =~ ^[0-9A-Za-z._+-]+$ ]]
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Verify static APK filename
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/releaseDebug/YANIME.apk

      - name: Upload optimized APK
        uses: actions/upload-artifact@v7
        with:
          name: yanime-apk
          path: app/build/outputs/apk/releaseDebug/YANIME.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish versioned YANIME release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release history generator
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download latest APK
        uses: actions/download-artifact@v7
        with:
          name: yanime-apk
          path: release-apk

      # Remove legacy non-versioned releases/tags left by earlier CI runs.
      - name: Remove legacy release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for legacy_tag in latest v; do
            if gh release view "$legacy_tag" >/dev/null 2>&1; then
              gh release delete "$legacy_tag" --yes
            fi
            # The tag may already be absent; that is not a release-job failure.
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$legacy_tag" >/dev/null 2>&1 || true
          done

      - name: Publish versioned YANIME release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          name: ${{ needs.build.outputs.version_name }}
          target_commitish: main
          make_latest: true
          prerelease: false
          draft: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-apk/YANIME.apk

      - name: Update automatic release history
        env:
          GH_TOKEN: ${{ github.token }}
          YANIME_VERSION: ${{ needs.build.outputs.version_name }}
        run: python3 .github/scripts/update_release_history.py
